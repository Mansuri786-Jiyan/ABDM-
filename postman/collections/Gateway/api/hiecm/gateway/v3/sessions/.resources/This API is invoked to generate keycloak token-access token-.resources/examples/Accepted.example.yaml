$kind: http-example
request:
  url: "{{baseUrl}}/api/hiecm/gateway/v3/sessions"
  method: POST
  headers:
    - key: REQUEST-ID
      value: 18235d89-cb13-479d-ad71-7a57d5f669a8
      description: Unique UUID for track the end to end request transaction
    - key: TIMESTAMP
      value: 2022-10-06T15:10:00.587Z
      description: Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds
    - key: X-CM-ID
      value: sbx
      description: Suffix of the consent manager to which the request was intended
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "clientId": "SBX_0000",
        "clientSecret": "0******-***-***-***-a****",
        "grantType": "client_credentials"
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "accessToken": "{{json_web_token_1bs0}}",
        "expiresIn": 1200,
        "refreshExpiresIn": 1800,
        "refreshToken": "{{json_web_token_1bs0}}",
        "tokenType": "bearer"
      }
order: 1000
